server.port=8080
spring.application.name=Travel Budget Planner

# Teal theme color
app.theme.color=#008080
app.theme.color.light=#e0f2f2
app.theme.color.dark=#004d4d

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cis2232_travel_budget_planner?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
